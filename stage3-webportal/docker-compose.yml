name: raidtheroot-stage3

services:
  rtr-stage3:
    build: .
    container_name: rtr-stage3
    restart: unless-stopped
    networks:
      - stage3-net
    # No published ports: reachable only through the reverse proxy.
    privileged: false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.5

networks:
  stage3-net:
    name: stage3-net
    external: true
