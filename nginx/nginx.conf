worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 64M;

    # Access logging
    log_format rtr '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent host=$host';
    access_log /var/log/nginx/access.log rtr;
    error_log  /var/log/nginx/error.log warn;

    # Rate limiting: deters brute-force flag guessing and endpoint enumeration
    # against the control plane.
    limit_req_zone $binary_remote_addr zone=rtr_limit:10m rate=10r/s;

    # Docker's embedded DNS server. Required so that upstream hostnames are
    # resolved at REQUEST time rather than at startup - without this, Nginx
    # refuses to boot whenever a challenge container is not yet running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ---- HTTP: redirect everything to HTTPS -------------------------------
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- CTFd control plane ----------------------------------------------
    server {
        listen 443 ssl;
        server_name ctf.rtr.local;

        ssl_certificate     /etc/nginx/certs/rtr.crt;
        ssl_certificate_key /etc/nginx/certs/rtr.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=rtr_limit burst=20 nodelay;

            # Hostname held in a variable => resolved per request via the
            # Docker resolver above, so this block never blocks startup.
            set $ctfd_upstream "rtr-ctfd:8000";
            proxy_pass http://$ctfd_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Stage 3 challenge: VAULT-03 internal portal ----------------------
    # Participants reach this only after Stage 2 reveals the hostname.
    server {
        listen 443 ssl;
        server_name vault-03.rtr.local;

        ssl_certificate     /etc/nginx/certs/rtr.crt;
        ssl_certificate_key /etc/nginx/certs/rtr.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=rtr_limit burst=50 nodelay;

            set $stage3_upstream "rtr-stage3:5000";
            proxy_pass http://$stage3_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

   
            proxy_pass_header X-Cipher-Hint;
        }
    }

    # ---- Default: reject anything not addressed by hostname ---------------
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/rtr.crt;
        ssl_certificate_key /etc/nginx/certs/rtr.key;

        return 444;
    }
}
